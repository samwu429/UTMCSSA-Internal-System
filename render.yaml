services:
  - type: web
    name: utmcssa-internal-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_BASE_PATH
        value: /api/v1
      - key: FRONTEND_DIST_DIR
        value: /app/frontend_dist
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://samwu429.github.io
      - key: STUDENT_EMAIL_DOMAINS
        value: '["mail.utoronto.ca","utoronto.ca"]'
      - key: ALUMNI_EMAIL_DOMAINS
        value: '["alum.utoronto.ca","alumni.utoronto.ca"]'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: UTMCSSA <noreply@utmcssa.ca>
      - key: ORGANIZATION_TIMEZONE
        value: America/Toronto
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /var/document-vault
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
